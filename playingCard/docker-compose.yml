version: "3.7"

services:
  mongodb_container:
    image: mongo:latest
    volumes:
      - "./mongo_data_container:/data:/data/db"
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password

volumes:
  mongodb_data_container:
